<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Successful</title>

    <style>
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
          font-family: Arial, sans-serif;
        }

        body {
          background: #f5f7fb;
          display: flex;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
          padding: 20px;
        }

        .container {
          background: white;
          max-width: 500px;
          width: 100%;
          padding: 40px 30px;
          border-radius: 18px;
          box-shadow: 0 10px 30px rgba(0,0,0,0.08);
          text-align: center;
        }

        .success-icon {
          font-size: 60px;
          margin-bottom: 20px;
        }

        h1 {
          font-size: 30px;
          color: #111827;
          margin-bottom: 15px;
        }

        p {
          color: #6b7280;
          line-height: 1.7;
          margin-bottom: 18px;
          font-size: 16px;
        }

        .download-btn {
          display: inline-block;
          margin-top: 10px;
          background: #111827;
          color: white;
          text-decoration: none;
          padding: 16px 28px;
          border-radius: 12px;
          font-size: 16px;
          font-weight: bold;
          transition: 0.3s ease;
        }

        .download-btn:hover {
          background: #000;
          transform: translateY(-2px);
        }

        .footer {
          margin-top: 30px;
          font-size: 14px;
          color: #9ca3af;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="success-icon">🎉</div>

    <h1>Payment Successful</h1>

    <p>
        Thank you for purchasing
        <strong>The Student AI Income Blueprint</strong>.
    </p>

    <p>
        We have successfully received your payment.
        Your ebook is now ready for instant access.
    </p>

    <a
            class="download-btn"
            href="https://drive.google.com/file/d/1vzi92gv1fd46Nb0MyhsIGTKZaDvKlSD-/view?usp=sharing"
            target="_blank"
    >
        Download Your Ebook
    </a>

    <div class="footer">
        If you face any issues accessing the ebook,
        please contact support.
    </div>

</div>

</body>
</html>

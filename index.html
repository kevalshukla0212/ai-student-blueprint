<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful</title>

    <style>
        body {
          font-family: Arial, sans-serif;
          background: #f5f7fb;
          display: flex;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
          margin: 0;
          padding: 20px;
        }

        .box {
          background: white;
          padding: 40px;
          border-radius: 18px;
          max-width: 500px;
          width: 100%;
          text-align: center;
          box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        h1 {
          margin-bottom: 15px;
        }

        p {
          color: #666;
          line-height: 1.6;
        }

        .btn {
          display: inline-block;
          margin-top: 20px;
          background: black;
          color: white;
          padding: 14px 24px;
          border-radius: 10px;
          text-decoration: none;
          font-weight: bold;
        }

        .hidden {
          display: none;
        }
    </style>
</head>

<body>

<div class="box" id="content">
    <h1>🎉 Payment Successful</h1>

    <p>
        Thank you for purchasing
        <strong>The Student AI Income Blueprint</strong>.
    </p>

    <p>Your ebook is ready for download.</p>

    <a
            class="btn"
            href="https://drive.google.com/file/d/1vzi92gv1fd46Nb0MyhsIGTKZaDvKlSD-/view?usp=sharing"
            target="_blank"
    >
        Download Ebook
    </a>
</div>

<div class="box hidden" id="blocked">
    <h1>Access Restricted</h1>

    <p>
        This page is only available after successful payment.
    </p>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const access = params.get("access");

    if (access !== "KX82P91Q") {
      document.getElementById("content").classList.add("hidden");
      document.getElementById("blocked").classList.remove("hidden");
    }
</script>

</body>
</html>
